name: Build & Release

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc make ninja-build python3 \
            libsdl2-dev libsdl2-ttf-dev libncurses-dev

      - name: Configure
        run: ./configure --target-list="chip8,mos,rca"

      - name: Build
        run: ninja

      - name: Package
        run: tar czf gemu-linux-x86_64.tar.gz -C bin gemu gemu-chip8 gemu-mos gemu-rca

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gemu-linux-x86_64
          path: gemu-linux-x86_64.tar.gz
          retention-days: 7

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            make
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-python

      - name: Configure
        run: python3 configure --target-list="chip8,mos,rca"

      - name: Build
        run: ninja

      - name: Gather runtime DLLs
        run: |
          for exe in bin/*.exe; do
            { ldd "$exe" 2>/dev/null || true; } | awk '/mingw64/{print $3}' | while IFS= read -r dll; do
              cp -n "$dll" bin/ 2>/dev/null || true
            done
          done

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path bin\* -DestinationPath gemu-windows-x86_64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gemu-windows-x86_64
          path: gemu-windows-x86_64.zip
          retention-days: 7

  build-windows-i686:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          install: >-
            make
            mingw-w64-i686-toolchain
            mingw-w64-i686-SDL2
            mingw-w64-i686-ninja
            mingw-w64-i686-python

      # NT 5.2 (XP/2003/ReactOS) compatible build: no OpenSSL (it hard-imports
      # Vista+ SRW locks), Windows headers pinned to 5.2 so Vista-only APIs
      # fail at compile time, PE subsystem version set to 5.1.
      - name: Configure
        run: >-
          python3 configure --target-list="chip8,mos,rca" --disable-crypto
          --extra-cflags="-D_WIN32_WINNT=0x0502 -DWINVER=0x0502"
          --extra-ldflags="-Wl,--major-subsystem-version=5 -Wl,--minor-subsystem-version=1"

      - name: Build
        run: ninja

      - name: Gather runtime DLLs
        # msys2's ldd is 64-bit and cannot trace i686 PE binaries, so walk
        # the PE import tables with objdump instead (recursively, resolving
        # against /mingw32/bin; system DLLs are not there and get skipped).
        run: |
          queue=(bin/*.exe)
          seen=" "
          while [ ${#queue[@]} -gt 0 ]; do
            f="${queue[0]}"; queue=("${queue[@]:1}")
            for dll in $(objdump -p "$f" | awk '/DLL Name:/{print $3}'); do
              case "$seen" in *" $dll "*) continue;; esac
              seen="$seen$dll "
              if [ -f "/mingw32/bin/$dll" ]; then
                cp -n "/mingw32/bin/$dll" bin/
                queue+=("/mingw32/bin/$dll")
              fi
            done
          done
          echo "Bundled:"; ls -la bin/

      - name: Verify NT 5.2 compatibility
        # Fail loudly if any shipped binary statically imports a Vista+ API
        # (GetProcAddress-style runtime lookups are fine and don't appear in
        # the import table that objdump -p prints).
        run: |
          vista_apis='AcquireSRWLockExclusive|AcquireSRWLockShared|ReleaseSRWLockExclusive|ReleaseSRWLockShared|TryAcquireSRWLockExclusive|InitializeConditionVariable|SleepConditionVariableCS|SleepConditionVariableSRW|WakeConditionVariable|WakeAllConditionVariable|GetTickCount64|InitOnceExecuteOnce|inet_pton|inet_ntop|GetFileInformationByHandleEx|SetDefaultDllDirectories|AddDllDirectory|RegGetValueW|BCryptGenRandom|GetSystemTimePreciseAsFileTime'
          rc=0
          for f in bin/*.exe bin/*.dll; do
            hits=$(objdump -p "$f" | grep -wE "($vista_apis)" || true)
            if [ -n "$hits" ]; then
              echo "ERROR: $f has Vista+ static imports:"; echo "$hits"
              rc=1
            fi
            subsys=$(objdump -p "$f" | awk '/MajorSubsystemVersion/{print $2}')
            if [ "${subsys:-0}" -gt 5 ] && [[ "$f" == *.exe ]]; then
              echo "ERROR: $f MajorSubsystemVersion=$subsys (>5, will not load on NT5)"
              rc=1
            fi
          done
          exit $rc

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path bin\* -DestinationPath gemu-windows-i686.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gemu-windows-i686
          path: gemu-windows-i686.zip
          retention-days: 7

  release:
    needs: [build-linux, build-windows, build-windows-i686]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gemu-linux-x86_64
          path: .

      - uses: actions/download-artifact@v4
        with:
          name: gemu-windows-x86_64
          path: .

      - uses: actions/download-artifact@v4
        with:
          name: gemu-windows-i686
          path: .

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: gemu
          prerelease: true
          body: "This is an unstable build of gemu that is not suitable for production yet."
          files: |
            gemu-linux-x86_64.tar.gz
            gemu-windows-x86_64.zip
            gemu-windows-i686.zip
